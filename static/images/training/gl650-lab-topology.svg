<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 763" width="720" height="763" role="img" aria-labelledby="t d">
<title id="t">Your GL650 lab: seven machines</title>
<desc id="d">Each student gets seven machines. On the lab network (example.com): an IdM server (Enterprise Linux 9), a registered host (Enterprise Linux 10), an upgrade host for Leapp 9 to 10 (Enterprise Linux 9), the Satellite server (Foreman and Katello, Enterprise Linux 9, 20 GB RAM, 4 CPU) and a Capsule server (Enterprise Linux 9, 12 GB RAM, 4 CPU). The Satellite server serves DHCP and TFTP on the isolated satellite network, 192.168.50.0/24, where a blank system network boots as a provisioning target. The Capsule serves DHCP, TFTP and DNS on the isolated capsule network, 192.168.60.0/24, where a blank system is the KVM compute resource.</desc>
